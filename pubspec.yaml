name: shopping_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # New Database (Alternative to Drift)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  
  # Data Export
  file_picker: ^8.1.3
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  
  # Charts
  fl_chart: ^0.70.2
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  
  # Auth & Sync
  supabase_flutter: ^2.8.1
  connectivity_plus: ^6.1.1
  path: ^1.9.1
  crypto: ^3.0.6
  csv: ^7.0.0
  flutter_dotenv: ^5.2.1
  bcrypt: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
